<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoneyMate Dashboard</title><style>body{font-family:Arial,sans-serif;background:#f7f7f5;margin:0;color:#222}.wrap{max-width:1000px;margin:30px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 18px #0000000b}.num{font-size:28px;font-weight:700;margin-top:8px}.muted{color:#777}.bar{height:10px;background:#eee;border-radius:20px;overflow:hidden}.fill{height:100%;background:#222}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{margin:15px auto}}</style></head><body><div class="wrap"><h1>💰 MoneyMate</h1><p class="muted">LINE Bot • รายรับ–รายจ่าย</p><div id="cards" class="grid"></div><div class="card" style="margin-top:16px"><h2>รายจ่ายตามหมวด</h2><div id="cats"></div></div><div class="card" style="margin-top:16px"><h2>รายการล่าสุด</h2><div id="recent"></div></div></div><script>const money=n=>new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:0}).format(n);async function load(){const [s,r]=await Promise.all([fetch('/api/summary').then(x=>x.json()),fetch('/api/recent').then(x=>x.json())]);document.querySelector('#cards').innerHTML=[['รายรับ',s.income],['รายจ่าย',s.expense],['คงเหลือ',s.balance]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="num">${money(x[1])}</div></div>`).join('');const max=s.categories[0]?.total||1;document.querySelector('#cats').innerHTML=s.categories.map(c=>`<div class="row"><span>${c.category}</span><b>${money(c.total)}</b></div><div class="bar"><div class="fill" style="width:${Math.min(100,c.total/max*100)}%"></div></div>`).join('');document.querySelector('#recent').innerHTML=r.map(x=>`<div class="row"><span>#${x.id} ${x.category}<br><small class="muted">${x.occurred_at.replace('T',' ')}</small></span><b>${x.type==='income'?'+':'-'}${money(x.amount)}</b></div>`).join('')}load()</script></body></html>
