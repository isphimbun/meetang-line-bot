 if(!featureOn('loan'))return denied('🏠 บ้าน & สินเชื่อ');
 const d=loanData||{}; const m=d.mortgage; const forecast=d.forecast||[]; const ins=d.insurance||[]; const ex=d.expenses||[]; const inf=d.insurance_forecasts||{};

ยประกัน ${money(monthInsPays.reduce((a,p)=>a+Number(p.amount||0),0))}</small></div></div>`;

function loanForm(){if(!isAdmin())return;const m=loanData?.mortgage||{};document.getElementById('modalTitle').textContent='🏦 ตั้งค่าสินเชื่อบ้าน';document.getElementById('modalBody').innerHTML=`<p style="margin-top:0;color:var(--muted);font-size:12px">วงนี้คือ “สินเชื่อบ้าน” เท่านั้น ส่วน MRTA/ประกันที่ผ่อนแยกให้เพิ่มในเมนู 🛡️ ประกันด้านล่าง</p><label>ชื่อบ้าน/คอนโด</label><input class="input" id="lm_name" value="${esc(m.property_name||hname())}"><label>ราคาซื้อ</label><input class="input" id="lm_price" type="number" min="0" value="${m.purchase_price||''}"><label>วงเงินกู้บ้าน</label><input class="input" id="lm_loan" type="number" min="0" value="${m.loan_amount||''}"><label>ค่างวด/เดือน <small style="color:var(--muted)">(เว้นว่างให้ระบบคำนวณประมาณการ)</small></label><input class="input" id="lm_pay" type="number" min="0" value="${m.monthly_payment||''}"><label>วันที่เริ่มกู้</label><input class="input" id="lm_start" type="date" value="${m.start_date||''}"><label>ระยะเวลากู้ (ปี)</label><input class="input" id="lm_term" type="number" min="1" max="40" value="${m.term_years||30}"><label>ธนาคาร</label><input class="input" id="lm_bank" value="${esc(m.bank||'')}"><label>เลขที่สัญญา</label><input class="input" id="lm_contract" value="${esc(m.contract_no||'')}"><label>วันชำระ</label><input class="input" id="lm_day" type="number" min="1" max="31" value="${m.payment_day||31}"><label>MRR ปัจจุบัน (%)</label><input class="input" id="lm_mrr" type="number" step="0.01" value="${m.current_mrr||''}"><hr><h3 style="margin:8px 0">📈 ตารางดอกเบี้ย</h3><p style="color:var(--muted);font-size:12px">ใส่เฉพาะช่วงที่มีจริง เช่น ปี 1 / ปี 2 / ปี 3 / ปี 4 เป็นต้นไป</p>${[0,1,2,3].map(i=>{const r=(m.rates||[])[i]||{};return `<div style="border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0"><b>ช่วงที่ ${i+1}</b><input class="input" id="r${i}label" placeholder="เช่น ปีที่ ${i+1}" value="${esc(r.label||'')}"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input class="input" id="r${i}rate" type="number" step="0.01" placeholder="อัตรา % เช่น 1.80" value="${r.rate_percent||''}"><select class="input" id="r${i}type"><option value="fixed" ${r.rate_type==='fixed'?'selected':''}>Fix</option><option value="mrr" ${r.rate_type==='mrr'?'selected':''}>MRR +/−</option></select></div><input class="input" id="r${i}off" type="number" step="0.01" placeholder="ถ้า MRR เช่น -6.08" value="${r.mrr_offset??''}"></div>`}).join('')}<button class="btn primary" onclick="saveLoan()">บันทึกสินเชื่อ</button>`;document.getElementById('modal').classList.add('show')}
async function saveLoan(){const loan=Number(document.getElementById('lm_loan').value||0),term=Number(document.getElementById('lm_term').value||30),start=document.getElementById('lm_start').value;const rates=[0,1,2,3].map(i=>{let sd=start,ed='';if(start){let d=new Date(start+'T00:00:00');d.setFullYear(d.getFullYear()+i);sd=d.toISOString().slice(0,10);if(i<3){let e=new Date(start+'T00:00:00');e.setFullYear(e.getFullYear()+i+1);e.setDate(e.getDate()-1);ed=e.toISOString().slice(0,10)}}return {label:document.getElementById('r'+i+'label').value.trim(),rate_percent:Number(document.getElementById('r'+i+'rate').value||0),rate_type:document.getElementById('r'+i+'type').value,mrr_offset:Number(document.getElementById('r'+i+'off').value||0),start_date:sd,end_date:ed}}).filter(r=>r.label||r.rate_percent||r.mrr_offset);const firstRate=rates[0]?rates[0].rate_type==='mrr'?Number(document.getElementById('lm_mrr').value||0)+Number(rates[0].mrr_offset||0):Number(rates[0].rate_percent||0):0;let pay=Number(document.getElementById('lm_pay').value||0);if(pay>0&&loan>0&&firstRate>0){const interest=loan*firstRate/100/12;if(pay<interest){alert(`ค่างวด ${money(pay)} ต่ำกว่าดอกเบี้ยเดือนแรกประมาณ ${money(interest)} ระบบไม่บันทึกค่ะ`);return}}const p={user_id:uid,household_id:activeId,property_name:document.getElementById('lm_name').value,purchase_price:Number(document.getElementById('lm_price').value||0),loan_amount:loan,monthly_payment:pay,start_date:start,term_years:term,bank:document.getElementById('lm_bank').value,contract_no:document.getElementById('lm_contract').value,payment_day:Number(document.getElementById('lm_day').value||31),current_mrr:Number(document.getElementById('lm_mrr').value||0),rates};await api('/api/loan',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});closeModal();await loadData();render()}
function loanPaymentForm(){document.getElementById('modalTitle').textContent='💸 บันทึกค่างวด / โปะ';document.getElementById('modalBody').innerHTML=`<p style="margin-top:0;color:var(--muted);font-size:12px">ใส่แค่ “ยอดที่จ่ายทั้งหมด” ก็ได้ค่ะ MeeTang จะคำนวณเงินต้นและดอกเบี้ยจากยอดหนี้และอัตราดอกเบี้ยให้อัตโนมัติ</p><label>วันที่</label><input class="input" id="lp_date" type="date" value="${new Date().toISOString().slice(0,10)}"><label>ยอดที่จ่ายทั้งหมด</label><input class="input" id="lp_amount" type="number" min="0" placeholder="เช่น 13200"><label>ตัดเงินต้น <small style="color:var(--muted)">(เว้นว่าง = คำนวณอัตโนมัติ)</small></label><input class="input" id="lp_principal" type="number" min="0"><label>ดอกเบี้ย <small style="color:var(--muted)">(เว้นว่าง = คำนวณอัตโนมัติ)</small></label><input class="input" id="lp_interest" type="number" min="0"><label>โปะเพิ่มจากค่างวด</label><input class="input" id="lp_extra" type="number" min="0" value="0"><label>หมายเหตุ</label><input class="input" id="lp_note"><button class="btn primary" onclick="saveLoanPayment()">บันทึกค่างวด</button>`;document.getElementById('modal').classList.add('show')}
async function saveLoanPayment(){const p={user_id:uid,household_id:activeId,payment_date:document.getElementById('lp_date').value,amount:Number(document.getElementById('lp_amount').value||0),principal:Number(document.getElementById('lp_principal').value||0),interest:Number(document.getElementById('lp_interest').value||0),extra_principal:Number(document.getElementById('lp_extra').value||0),note:document.getElementById('lp_note').value};await api('/api/loan/payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});closeModal();await loadData();render()}
function insuranceForm(){if(!isAdmin())return;document.getElementById('modalTitle').textContent='🛡️ เพิ่มประกันที่เกี่ยวข้องกับบ้าน';document.getElementById('modalBody').innerHTML=`<p style="margin-top:0;color:var(--muted);font-size:12px">ประกันเก็บแยกจากสินเชื่อบ้านได้ และถ้าเป็น MRTA ที่ผ่อนแยก สามารถใช้อัตราดอกเบี้ยเดียวกับสินเชื่อบ้านได้</p><label>ประเภทประกัน</label><input class="input" id="in_type" placeholder="เช่น MRTA / ประกันอัคคีภัย"><label>บริษัท</label><input class="input" id="in_provider"><label>เบี้ยประกันรวม</label><input class="input" id="in_amount" type="number" min="0" placeholder="เช่น 851887"><label>วิธีชำระ</label><select class="input" id="in_method" onchange="toggleInsuranceInstallment()"><option value="จ่ายครั้งเดียว">จ่ายครั้งเดียว</option><option value="ผ่อนแยก">ผ่อนแยก (คนละวงกับสินเชื่อบ้าน)</option><option value="รายปี">ต่ออายุรายปี</option></select><div id="in_installment_box" style="display:none"><label>ยอดที่นำมาผ่อน</label><input class="input" id="in_fin" type="number" min="0" placeholder="ถ้าผ่อนเต็มจำนวน ให้เท่ากับเบี้ยรวม"><label>จำนวนงวด</label><input class="input" id="in_n" type="number" min="1" placeholder="เช่น 120"><label>ค่างวด/เดือน <small style="color:var(--muted)">(เว้นว่างให้ระบบประมาณการ)</small></label><input class="input" id="in_pay" type="number" min="0"><label>วันที่เริ่มผ่อน</label><input class="input" id="in_start" type="date" value="${new Date().toISOString().slice(0,10)}"><label>วันชำระ</label><input class="input" id="in_day" type="number" min="1" max="31" value="31"><label>ดอกเบี้ย</label><select class="input" id="in_rate_mode"><option value="same_as_mortgage">ใช้ดอกเบี้ยเดียวกับสินเชื่อบ้าน</option><option value="custom">กำหนดเอง</option></select><input class="input" id="in_rate" type="number" step="0.01" placeholder="ถ้ากำหนดเอง เช่น 1.80"></div><label>วันครบกำหนด/วันต่ออายุ</label><input class="input" id="in_due" type="date"><label>สถานะ</label><select class="input" id="in_status"><option>ยังไม่จ่าย</option><option>จ่ายแล้ว</option></select><button class="btn primary" onclick="saveInsurance()">บันทึกประกัน</button>`;document.getElementById('modal').classList.add('show')}
function toggleInsuranceInstallment(){const on=document.getElementById('in_method').value==='ผ่อนแยก';document.getElementById('in_installment_box').style.display=on?'block':'none'}
async function saveInsurance(){const method=document.getElementById('in_method').value, amount=Number(document.getElementById('in_amount').value||0), fin=Number(document.getElementById('in_fin')?.value||0), n=Number(document.getElementById('in_n')?.value||0), pay=Number(document.getElementById('in_pay')?.value||0);if(method==='ผ่อนแยก'&&(!fin||!n)){alert('กรอกยอดที่นำมาผ่อนและจำนวนงวดก่อนค่ะ');return}const p={user_id:uid,household_id:activeId,insurance_type:document.getElementById('in_type').value,provider:document.getElementById('in_provider').value,amount,payment_cycle:method,due_date:document.getElementById('in_due').value,status:document.getElementById('in_status').value,payment_method:method,financed_amount:fin||amount,financed_installments:n,financed_monthly_payment:pay,financed_start_date:document.getElementById('in_start')?.value||'',financed_payment_day:Number(document.getElementById('in_day')?.value||31),rate_mode:document.getElementById('in_rate_mode')?.value||'same_as_mortgage',rate_percent:Number(document.getElementById('in_rate')?.value||0)};await api('/api/loan/insurance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});closeModal();await loadData();render()}

function shift(n){const d=new Date(month+'-01');d.setMonth(d.getMonth()+n);month=d.toISOString().slice(0,7);loadData().then(render)}
function showAddHelp(){alert('กลับไปที่ LINE แล้วพิมพ์ เช่น “กินข้าว 60” หรือ “เงินเดือน 25000”')}
function openMobileMore(){const items=[];if(featureOn('loan'))items.push(`<button class="btn" onclick="tab='loan';closeModal();render()"><i class="fa-solid fa-house-chimney"></i> บ้าน & สินเชื่อ</button>`);if(featureOn('installment'))items.push(`<button class="btn" onclick="tab='installment';closeModal();render()"><i class="fa-solid fa-credit-card"></i> รายการผ่อน</button>`);if(isAdmin()||isSuperAdmin)items.push(`<button class="btn" onclick="tab='settings';closeModal();render()"><i class="fa-solid fa-gear"></i> ตั้งค่า</button>`);items.push(`<button class="btn" onclick="showAddHelp();closeModal()"><i class="fa-solid fa-plus"></i> เพิ่มรายการ</button>`);document.getElementById('modalTitle').textContent='☰ เมนูเพิ่มเติม';document.getElementById('modalBody').innerHTML=`<div class="mobile-more">${items.join('')}</div>`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openHouses(){document.getElementById('modalTitle').textContent='🏠 บ้านของฉัน';document.getElementById('modalBody').innerHTML=`<p style="color:#8c8088">เลือกบ้าน หรือจัดการบ้าน</p><div class="manage">${houses.map(h=>`<div class="row"><div><b>${h.name}${h.id===activeId?' ⭐':''}</b><small style="display:block;color:#8c8088">${h.role==='owner'?'ADMIN / เจ้าของ':h.role==='admin'?'ADMIN':'สมาชิก'} · ${h.invite_code}</small></div><div class="actions"><button class="btn" onclick="switchHouse(${h.id});closeModal()">ใช้บ้านนี้</button>${h.role==='owner'?`<button class="btn" onclick="renameHouse(${h.id},'${h.name.replace(/'/g,"\\'")}')">แก้ชื่อ</button><button class="btn" onclick="deleteHouse(${h.id},'${h.name.replace(/'/g,"\\'")}')">ลบ</button>`:''}</div></div>`).join('')}</div><div style="margin-top:12px"><button class="btn primary" onclick="createHouse()">＋ สร้างบ้านใหม่</button></div>`;document.getElementById('modal').classList.add('show')}
async function createHouse(){const n=prompt('ชื่อบ้านใหม่ เช่น ร้านขนม / บ้านแม่ / เที่ยวญี่ปุ่น');if(!n?.trim())return;await api('/api/households/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,name:n.trim()})});await load();openHouses()}
async function renameHouse(id,old){const n=prompt('เปลี่ยนชื่อบ้าน',old);if(!n||n.trim()===old)return;await api('/api/households/rename',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,household_id:id,name:n.trim()})});await load();openHouses()}
async function deleteHouse(id,name){if(!confirm(`ลบบ้าน “${name}” ?`))return;const n=prompt(`พิมพ์ชื่อบ้านเพื่อยืนยัน\n${name}`);if(n!==name)return alert('ยกเลิกการลบ');await api(`/api/households/${id}?user_id=${encodeURIComponent(uid)}`,{method:'DELETE'});closeModal();await load()}
if(uid)load();else setup();
</script>
</body></html>
