<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeeTang — Dashboard</title>
<style>
:root{--bg:#fff8fb;--card:#fff;--ink:#352c31;--muted:#8c8088;--pink:#ff9fbd;--pink2:#ffe6ef;--green:#94d9b1;--green2:#e7f8ee;--blue:#a8d7f5;--blue2:#e8f4fc;--yellow:#ffd98d;--yellow2:#fff3d3;--purple:#c9b8ef;--purple2:#f0eafb;--line:#eee4e9;--shadow:0 10px 30px rgba(135,105,122,.10)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff8fb,#f8fbff);color:var(--ink);font-family:"Noto Sans Thai",Arial,sans-serif}.shell{max-width:1180px;margin:auto;padding:18px}.app{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 36px);background:#fff;border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
.side{background:#fffafd;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 24px}.logo{width:44px;height:44px;border-radius:15px;background:#ffe5ef;display:grid;place-items:center;font-size:25px}.brand b{font-size:21px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:1px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:13px;font:inherit;color:#665a62;cursor:pointer}.nav button.active{background:#ffdfe9;color:#c94870;font-weight:800}.sidefoot{margin-top:auto;background:#fff1f6;border-radius:16px;padding:12px;color:#8a596a;font-size:12px;line-height:1.55}
.main{padding:22px 24px;background:#fff}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.housepick{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);padding:8px 10px;border-radius:13px}.housepick select{border:0;outline:0;background:transparent;font:inherit;font-weight:700}.topright{display:flex;gap:8px;align-items:center}.month{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}.month button{border:0;background:#fff;font-size:18px;cursor:pointer}.btn{border:0;border-radius:12px;padding:10px 13px;font:inherit;cursor:pointer;background:#f7f1f4;color:#554b51}.btn.primary{background:var(--pink);color:#fff}.hero{display:flex;justify-content:space-between;align-items:end;margin:22px 0 15px}.hero h1{margin:0;font-size:24px}.hero p{margin:4px 0 0;color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{border-radius:18px;padding:17px}.metric.in{background:var(--green2)}.metric.out{background:#fff0f4}.metric.bal{background:var(--blue2)}.metric small{color:#7d7178}.metric strong{display:block;font-size:25px;margin-top:4px}.metric.in strong{color:#16844a}.metric.out strong{color:#df4f70}.metric.bal strong{color:#2176bd}.columns{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:19px;padding:17px}.panel h2{font-size:16px;margin:0 0 13px}.cat{display:grid;grid-template-columns:120px 1fr 70px 50px;align-items:center;gap:7px;margin:11px 0;font-size:12px}.cat .bar{height:9px;background:#f0ecef;border-radius:9px;overflow:hidden}.cat .fill{height:100%;background:var(--pink);border-radius:9px}.tx{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.tx:last-child{border-bottom:0}.tx .ico{font-size:17px}.tx b{font-size:12px}.tx small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.positive{color:#16844a}.negative{color:#df4f70}.houses{margin-top:14px}.housegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.house{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;cursor:pointer}.house.active{background:#fff0f5;border-color:#ffb5cb}.house b{display:block}.house small{display:block;color:var(--muted);margin-top:3px}.empty{padding:25px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#2d263055;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;border-radius:22px;max-width:560px;width:100%;padding:20px;box-shadow:0 25px 70px #0003}.pill{padding:6px 10px;border-radius:999px;font-size:12px}.pill.on{background:#e9f8ed;color:#287443}.pill.off{background:#f2f0f2;color:#777}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead button{border:0;border-radius:50%;width:32px;height:32px}.manage{display:grid;gap:8px;margin-top:12px}.manage .row{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}.manage .actions{display:flex;gap:6px;flex-wrap:wrap}.input{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;font:inherit;margin:8px 0}.setup{max-width:600px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:25px;padding:28px;box-shadow:var(--shadow)}

.loan-hero{background:linear-gradient(135deg,#f3fbf6,#fff8ef);border:1px solid #e4eee7;border-radius:22px;padding:20px;margin-top:18px;display:flex;justify-content:space-between;gap:15px;align-items:center}.loan-hero h1{margin:0;font-size:25px}.loan-hero p{margin:5px 0 0;color:var(--muted);font-size:13px}.loan-actions{display:flex;gap:8px;flex-wrap:wrap}.loan-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}.loan-card{border:1px solid var(--line);border-radius:18px;padding:15px;background:#fff}.loan-card small{color:var(--muted);display:block}.loan-card strong{display:block;font-size:21px;margin-top:5px}.loan-card.blue{background:#edf7ff}.loan-card.green{background:#eefaf2}.loan-card.pink{background:#fff0f5}.loan-card.gold{background:#fff7df}.loan-card.purple{background:#f5f1fc}.loan-progress{height:8px;background:#eee;border-radius:9px;overflow:hidden;margin-top:10px}.loan-progress span{display:block;height:100%;background:#65b985;border-radius:9px}.loan-layout{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;margin-top:14px}.loan-chart{height:260px;display:flex;align-items:flex-end;gap:6px;padding:15px 8px 5px;background:linear-gradient(180deg,#fbfffc,#fff);border-radius:14px}.loan-chart .bar{flex:1;min-width:3px;background:linear-gradient(180deg,#75c995,#ccefd8);border-radius:6px 6px 2px 2px}.loan-chart-label{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:4px}.donut{width:170px;height:170px;border-radius:50%;background:conic-gradient(#63bd88 0 68%,#f3a0b5 68% 96%,#b6c6ee 96% 100%);display:grid;place-items:center;margin:8px auto}.donut:after{content:'ชำระแล้ว';width:102px;height:102px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:12px;color:var(--muted)}.loan-two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.loan-table{width:100%;border-collapse:collapse;font-size:12px}.loan-table th,.loan-table td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}.loan-table th{color:var(--muted);font-weight:600}.loan-list{display:grid;gap:8px}.loan-row{display:flex;justify-content:space-between;gap:10px;padding:11px;border:1px solid var(--line);border-radius:13px;background:#fff}.loan-row small{display:block;color:var(--muted);margin-top:3px}.tag{display:inline-flex;padding:5px 8px;border-radius:999px;background:#eaf7ef;color:#378354;font-size:11px}.loan-empty{padding:28px;text-align:center;background:#fbfafb;border:1px dashed #dfd5db;border-radius:16px;color:var(--muted)}

.inst-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.inst-card{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff}.inst-card h3{margin:0;font-size:16px}.inst-card .big{font-size:24px;font-weight:800;margin-top:8px}.inst-progress{height:8px;background:#eee;border-radius:9px;overflow:hidden;margin:10px 0}.inst-progress span{display:block;height:100%;background:#76c897}.inst-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.inst-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.inst-kpi .loan-card{min-height:78px}.status-good{color:#32804e;background:#eaf8ef;padding:5px 8px;border-radius:999px;font-size:11px}.status-warn{color:#a36d17;background:#fff4d8;padding:5px 8px;border-radius:999px;font-size:11px}
@media(max-width:850px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);padding:12px}.brand{padding-bottom:10px}.nav{grid-template-columns:repeat(5,1fr)}.nav button{font-size:12px;text-align:center}.sidefoot{display:none}.columns{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.loan-grid{grid-template-columns:1fr 1fr}.inst-grid{grid-template-columns:1fr}.inst-kpi{grid-template-columns:1fr 1fr}.loan-layout,.loan-two{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.topright{width:100%;justify-content:space-between}.housegrid{grid-template-columns:1fr 1fr}.cat{grid-template-columns:100px 1fr 60px 40px}}
</style>
</head>
<body>
<div id="root"></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">🏠 บ้านของฉัน</h2><button onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const root=document.getElementById('root');const money=n=>new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:0}).format(Number(n||0));
const icon={'อาหาร':'🍽️','เครื่องดื่ม':'☕','ของใช้':'🛒','เดินทาง':'🚗','ช้อปปิ้ง':'🛍️','บันเทิง':'🎬','บ้าน':'🏠','สุขภาพ':'💗','ท่องเที่ยว':'✈️','เงินเดือน':'💰','ธุรกิจ':'🏪','อื่นๆ':'📦'};
let uid=localStorage.getItem('meetang_user_id')||'',houses=[],activeId=null,summary={},recent=[],commands=[],permissions=null,loanData=null,installmentData=[],month=new Date().toISOString().slice(0,7),tab='home';
async function api(url,opt){const r=await fetch(url,opt);if(!r.ok)throw Error(await r.text());return r.json()}
function setup(){root.innerHTML=`<div class="setup"><div class="logo">🐰</div><h1>MeeTang</h1><p>Dashboard ดูข้อมูลการเงินแยกตามบ้าน</p><label>LINE User ID</label><input class="input" id="uid" placeholder="พิมพ์ “รหัสของฉัน” ใน LINE"><button class="btn primary" onclick="saveUid()">เข้า Dashboard →</button><p style="color:#8c8088;font-size:12px">ใช้รหัสของฉันจาก LINE เพื่อเชื่อมข้อมูลของคุณ</p></div>`}
function saveUid(){const v=document.getElementById('uid').value.trim();if(!v)return;uid=v;localStorage.setItem('meetang_user_id',v);load()}
async function load(){try{const h=await api('/api/households?user_id='+encodeURIComponent(uid));houses=h.households||[];activeId=h.active_household_id;if(!houses.length){root.innerHTML=`<div class="setup"><h1>🏠 ยังไม่มีบ้าน</h1><p>กลับไป LINE แล้วพิมพ์ <b>สร้างบ้าน บ้านของเรา</b></p></div>`;return}if(!activeId)activeId=houses[0].id;await loadPermissions();if(isAdmin())commands=(await api(`/api/commands?user_id=${encodeURIComponent(uid)}&household_id=${activeId}`)).commands||[];else commands=[];await loadData();render()}catch(e){root.innerHTML=`<div class="setup"><h2>เชื่อมต่อไม่สำเร็จ</h2><p>${e.message}</p></div>`}}
async function loadPermissions(){permissions=await api(`/api/permissions?user_id=${encodeURIComponent(uid)}&household_id=${activeId}`)}
function isAdmin(){return !!permissions?.is_admin}
function featureOn(name){return !!permissions?.members?.find(m=>m.user_id===uid)?.permissions?.[name] || isAdmin()}
async function loadData(){[summary,recent]=await Promise.all([api(`/api/summary?month=${month}&user_id=${encodeURIComponent(uid)}&household_id=${activeId}`),api(`/api/recent?limit=10&user_id=${encodeURIComponent(uid)}&household_id=${activeId}`)]);loanData=null;if(featureOn('loan')){try{loanData=await api(`/api/loan?user_id=${encodeURIComponent(uid)}&household_id=${activeId}`)}catch(e){loanData=null}};installmentData=[];if(featureOn('installment')){try{installmentData=(await api(`/api/installments?user_id=${encodeURIComponent(uid)}&household_id=${activeId}`)).plans||[]}catch(e){installmentData=[]}}}
function hname(){return houses.find(h=>h.id===activeId)?.name||'บ้านของเรา'}
function fmtMonth(v){const [y,m]=v.split('-');return ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][+m-1]+' '+(+y+543)}
function fmtDate(v){return new Date(v).toLocaleDateString('th-TH',{day:'numeric',month:'short'})}
function render(){const cmdBtn=isAdmin()?`<button class="btn" onclick="tab='settings';render()">🤖 คำสั่งบอท</button>`:'';const loanNav=featureOn('loan')?`<button class="${tab==='loan'?'active':''}" onclick="tab='loan';render()">🏠 บ้าน & สินเชื่อ</button>`:'';const instNav=featureOn('installment')?`<button class="${tab==='installment'?'active':''}" onclick="tab='installment';render()">💳 รายการผ่อน</button>`:'';const settingsNav=isAdmin()?`<button class="${tab==='settings'?'active':''}" onclick="tab='settings';render()">⚙️ ตั้งค่า</button>`:`<button class="${tab==='settings'?'active':''}" onclick="tab='settings';render()">⚙️ บัญชี</button>`;root.innerHTML=`<div class="shell"><div class="app"><aside class="side"><div class="brand"><div class="logo">🐰</div><div><b>MeeTang</b><small>มีตังค์ ไม่งงเรื่องเงิน</small></div></div><nav class="nav"><button class="${tab==='home'?'active':''}" onclick="tab='home';render()">🏠 หน้าหลัก</button><button class="${tab==='list'?'active':''}" onclick="tab='list';render()">📝 รายการ</button><button class="${tab==='summary'?'active':''}" onclick="tab='summary';render()">📊 สรุปรายเดือน</button><button onclick="openHouses()">🏠 บัญชีร่วม</button>${loanNav}${instNav}${settingsNav}</nav><div class="sidefoot">🐰 <b>ใช้งานผ่าน LINE</b><br>พิมพ์รายรับ/รายจ่ายได้เลย แล้วเลือกบ้านที่ต้องการดูจากด้านบน</div></aside><main class="main"><div class="top"><div class="housepick">🏠 <select onchange="switchHouse(this.value)">${houses.map(h=>`<option value="${h.id}" ${h.id===activeId?'selected':''}>${h.name}${h.id===activeId?' ⭐':''}</option>`).join('')}</select></div><div class="topright"><div class="month"><button onclick="shift(-1)">‹</button><b>📅 ${fmtMonth(month)}</b><button onclick="shift(1)">›</button></div>${cmdBtn}<button class="btn primary" onclick="showAddHelp()">＋ เพิ่มรายการ</button></div></div>${tab==='home'?home():tab==='list'?listPage():tab==='summary'?summaryPage():tab==='loan'?loanPage():tab==='installment'?installmentPage():settingsPage()}</main></div></div>`}
function home(){return `<div class="hero"><div><h1>สรุปการเงิน · ${hname()}</h1><p>ภาพรวมรายรับ รายจ่าย และเงินคงเหลือของบ้านนี้</p></div></div><div class="cards"><div class="metric in"><small>💰 รายรับ</small><strong>${money(summary.income)}</strong></div><div class="metric out"><small>💸 รายจ่าย</small><strong>${money(summary.expense)}</strong></div><div class="metric bal"><small>💚 คงเหลือ</small><strong>${money(summary.balance)}</strong></div></div><div class="columns"><div class="panel"><h2>📊 รายจ่ายตามหมวด</h2>${cats()}</div><div class="panel"><h2>📋 รายการล่าสุด</h2>${recentRows()}</div></div><div class="panel houses"><h2>🏠 บ้านที่ฉันมี</h2><div class="housegrid">${houses.map(h=>`<button class="house ${h.id===activeId?'active':''}" onclick="switchHouse(${h.id})">🏠 <b>${h.name}${h.id===activeId?' ⭐':''}</b><small>${h.role==='owner'?'ADMIN / เจ้าของ':h.role==='admin'?'ADMIN':'สมาชิก'} · รหัส ${h.invite_code}</small></button>`).join('')}</div></div>`}
function cats(){if(!summary.categories?.length)return '<div class="empty">เดือนนี้ยังไม่มีรายจ่าย</div>';const max=summary.categories[0].total||1;return summary.categories.slice(0,6).map(c=>`<div class="cat"><span>${icon[c.category]||'📦'} ${c.category}</span><div class="bar"><div class="fill" style="width:${Math.min(100,c.total/max*100)}%"></div></div><b>${money(c.total)}</b><span>${(c.total/Math.max(summary.expense,1)*100).toFixed(1)}%</span></div>`).join('')}
function recentRows(){if(!recent.length)return '<div class="empty">ยังไม่มีรายการ</div>';return recent.map(r=>`<div class="tx"><span class="ico">${icon[r.category]||'📦'}</span><div><b>${r.merchant||r.note||r.category}</b><small>${r.category} · ${fmtDate(r.occurred_at)}</small></div><b class="${r.type==='income'?'positive':'negative'}">${r.type==='income'?'+':'-'}${money(r.amount)}</b></div>`).join('')}
function listPage(){return `<div class="hero"><div><h1>📝 รายการล่าสุด</h1><p>${hname()} · ${fmtMonth(month)}</p></div></div><div class="panel">${recentRows()}</div>`}
function summaryPage(){return `<div class="hero"><div><h1>📊 สรุปรายเดือน</h1><p>${hname()}</p></div></div>${home()}`}
function loanPage(){
 if(!featureOn('loan'))return denied('🏠 บ้าน & สินเชื่อ');
 const d=loanData||{}; const m=d.mortgage; const forecast=d.forecast||[]; const ins=d.insurance||[]; const ex=d.expenses||[];
 if(!m)return `<div class="loan-hero"><div><h1>🏠 บ้าน & สินเชื่อ</h1><p>จัดการเงินกู้ ประกัน ค่าน้ำ ค่าไฟ และค่าใช้จ่ายของบ้านไว้ในที่เดียว</p></div>${isAdmin()?`<button class="btn primary" onclick="loanForm()">＋ เพิ่มสินเชื่อ</button>`:''}</div><div class="panel" style="margin-top:14px"><div class="loan-empty"><div style="font-size:38px">🏡</div><h2>ยังไม่ได้ตั้งค่าสินเชื่อบ้าน</h2><p>กรอกวงเงินกู้ ค่างวด และช่วงดอกเบี้ย แล้ว MeeTang จะคำนวณเงินต้น/ดอกเบี้ยให้เอง</p>${isAdmin()?`<button class="btn primary" onclick="loanForm()">เริ่มตั้งค่าสินเชื่อ</button>`:''}</div></div>`;
 const paid=Number(d.paid_principal||0), balance=Number(d.actual_balance||m.loan_amount||0), total=Number(m.loan_amount||0), pct=total?Math.min(100,paid/total*100):0; const next=forecast[0];
 const expenseTotal=ex.filter(x=>String(x.expense_date||'').startsWith(month)).reduce((a,x)=>a+Number(x.amount||0),0); const insuranceTotal=ins.reduce((a,x)=>a+Number(x.amount||0),0);
 const rows=forecast.slice(0,12).map(x=>`<tr><td>${x.no}</td><td>${x.date}</td><td>${x.rate.toFixed(2)}%</td><td>${money(x.payment)}</td><td>${money(x.principal)}</td><td>${money(x.interest)}</td><td>${money(x.balance)}</td></tr>`).join('');
 const bars=forecast.slice(0,36); const max=Math.max(...bars.map(x=>Number(x.balance)),1); const chart=bars.map(x=>`<div class="bar" style="height:${Math.max(5,Number(x.balance)/max*92)}%" title="งวด ${x.no}: ${money(x.balance)}"></div>`).join('');
 return `<div class="loan-hero"><div><h1>🏠 บ้าน & สินเชื่อ</h1><p>${esc(m.property_name||hname())} · ${esc(m.bank||'ยังไม่ระบุธนาคาร')}</p></div><div class="loan-actions">${isAdmin()?`<button class="btn" onclick="loanForm()">✏️ แก้ข้อมูลกู้</button>`:''}<button class="btn primary" onclick="loanPaymentForm()">＋ บันทึกค่างวด/โปะ</button></div></div>
 <div class="loan-grid"><div class="loan-card blue"><small>💰 เงินต้นคงเหลือ</small><strong>${money(balance)}</strong><div class="loan-progress"><span style="width:${pct}%"></span></div><small>ผ่อนเงินต้นแล้ว ${pct.toFixed(1)}%</small></div><div class="loan-card pink"><small>📅 ค่างวด/เดือน</small><strong>${money(m.monthly_payment)}</strong><small>ชำระวันที่ ${m.payment_day||'—'}</small></div><div class="loan-card green"><small>📈 ดอกเบี้ยปัจจุบัน</small><strong>${next?next.rate.toFixed(2):'—'}%</strong><small>${next?`ดอกงวดถัดไปประมาณ ${money(next.interest)}`:'กรอกตารางดอกเบี้ย'}</small></div><div class="loan-card gold"><small>💸 โปะสะสม</small><strong>${money(d.payments?.reduce((a,x)=>a+Number(x.extra_principal||0),0))}</strong><small>ลดเงินต้นเพิ่มเติม</small></div><div class="loan-card purple"><small>🛡️ ประกันรวม</small><strong>${money(insuranceTotal)}</strong><small>${ins.length} รายการ</small></div></div>

function settingsPage(){if(!isAdmin())return `<div class="hero"><div><h1>⚙️ บัญชี</h1><p>ข้อมูลการเชื่อมต่อของคุณ</p></div></div><div class="panel"><h2>🪪 LINE User ID</h2><p>${uid}</p><p style="color:#8c8088">ใช้รหัสนี้เชื่อม Dashboard กับบัญชี LINE ของคุณ</p><button class="btn" onclick="localStorage.removeItem('meetang_user_id');location.reload()">เปลี่ยนบัญชี LINE</button></div>`;return `<div class="hero"><div><h1>⚙️ ตั้งค่า Admin</h1><p>จัดการสมาชิกและเปิด/ปิดฟีเจอร์เฉพาะคนได้</p></div></div><div class="panel"><h2>👥 สิทธิ์สมาชิก</h2><p style="color:#8c8088">เฉพาะ Admin ของบ้านนี้เท่านั้นที่เปลี่ยนสิทธิ์ได้</p>${permissions.members.map(m=>`<div class="row"><div><b>${m.display_name||'สมาชิก '+m.user_id.slice(-4)}</b><small style="display:block;color:#8c8088">${m.role==='owner'?'👑 OWNER / ADMIN':m.role==='admin'?'🛡️ ADMIN':'👤 MEMBER'} · ${m.user_id}</small></div><div class="actions">${m.user_id===uid?'<span class="pill on">คุณ</span>':`<button class="btn" onclick='memberPerm(${JSON.stringify(m)})'>⚙️ จัดการสิทธิ์</button>`}</div></div>`).join('')}</div><div class="panel"><h2>🤖 คำสั่งบอท</h2><p style="color:#8c8088">เพิ่ม แก้ไข เปิด/ปิดคำสั่งได้ โดยไม่ต้องแก้โค้ด</p><button class="btn primary" onclick="commandForm()">＋ เพิ่มคำสั่ง</button><div class="manage" style="margin-top:15px">${commands.map(c=>`<div class="row"><div><b>${c.name}</b><small style="display:block;color:#8c8088">${c.aliases} · ${c.description||'ไม่มีคำอธิบาย'}</small></div><div class="actions"><span class="pill ${c.enabled?'on':'off'}">${c.enabled?'🟢 เปิด':'⚪ ปิด'}</span><button class="btn" onclick='commandForm(${JSON.stringify(c)})'>แก้ไข</button><button class="btn" onclick="removeCommand(${c.id},'${c.name.replace(/'/g,"\\'")}')">ลบ</button></div></div>`).join('')}</div></div><div class="panel"><h2>🛡️ สำรองข้อมูล</h2><p style="color:#8c8088">สำรองฐานข้อมูลปัจจุบันก่อน Deploy หรือเปลี่ยนระบบ</p><button class="btn" onclick="backupDb()">💾 ดาวน์โหลดฐานข้อมูลสำรอง</button></div><div class="panel"><h2>🪪 LINE User ID</h2><p>${uid}</p></div>`}
function memberPerm(m){document.getElementById('modalTitle').textContent='👥 สิทธิ์ของสมาชิก';document.getElementById('modalBody').innerHTML=`<h3>${esc(m.display_name||'สมาชิก')}</h3><p style="color:#8c8088">${esc(m.user_id)}</p><label style="display:flex;gap:8px;align-items:center;margin:12px 0"><input type="checkbox" id="permLoan" ${m.permissions.loan?'checked':''}> 🏠 บ้าน & สินเชื่อ</label><label style="display:flex;gap:8px;align-items:center;margin:12px 0"><input type="checkbox" id="permInst" ${m.permissions.installment?'checked':''}> 💳 รายการผ่อน</label><label>บทบาท</label><select class="input" id="memberRole"><option value="member" ${!m.is_admin?'selected':''}>MEMBER</option><option value="admin" ${m.is_admin?'selected':''}>ADMIN</option></select><button class="btn primary" onclick="saveMemberPerm('${m.user_id}')">บันทึกสิทธิ์</button>`;document.getElementById('modal').classList.add('show')}
async function saveMemberPerm(memberId){const payload={user_id:uid,household_id:activeId,features:{loan:document.getElementById('permLoan').checked,installment:document.getElementById('permInst').checked},role:document.getElementById('memberRole').value};await api('/api/permissions/member/'+encodeURIComponent(memberId),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});closeModal();await loadPermissions();if(isAdmin())commands=(await api(`/api/commands?user_id=${encodeURIComponent(uid)}&household_id=${activeId}`)).commands||[];render()}
function commandForm(c={id:0,name:'',aliases:'',action:'custom',description:'',enabled:true}){if(!isAdmin())return;document.getElementById('modalTitle').textContent=c.id?'✏️ แก้ไขคำสั่ง':'➕ เพิ่มคำสั่ง';document.getElementById('modalBody').innerHTML=`<label>ชื่อคำสั่ง</label><input class="input" id="cmdName" value="${esc(c.name)}" placeholder="เช่น ฝากเงิน"><label>คำที่ใช้ (คั่นด้วย ,)</label><input class="input" id="cmdAliases" value="${esc(c.aliases)}" placeholder="ฝากเงิน,ฝาก"><label>ประเภทการทำงาน</label><select class="input" id="cmdAction"><option value="custom">ทั่วไป</option><option value="income">เงินเข้า / รายรับ</option><option value="expense">เงินออก / รายจ่าย</option><option value="summary">สรุป</option><option value="recent">รายการล่าสุด</option><option value="delete_latest">ลบรายการล่าสุด</option><option value="help">วิธีใช้</option></select><label>คำอธิบาย</label><input class="input" id="cmdDesc" value="${esc(c.description||'')}" placeholder="อธิบายว่าคำสั่งนี้ทำอะไร"><label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="checkbox" id="cmdEnabled" ${c.enabled?'checked':''}> เปิดใช้งาน</label><button class="btn primary" onclick="saveCommand(${c.id||0})">บันทึก</button>`;document.getElementById('cmdAction').value=c.action||'custom';document.getElementById('modal').classList.add('show')}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
async function saveCommand(id){const payload={user_id:uid,household_id:activeId,name:document.getElementById('cmdName').value.trim(),aliases:document.getElementById('cmdAliases').value.trim(),action:document.getElementById('cmdAction').value,description:document.getElementById('cmdDesc').value.trim(),enabled:document.getElementById('cmdEnabled').checked};if(!payload.name||!payload.aliases)return alert('กรอกชื่อคำสั่งและคำที่ใช้ก่อน');await api(id?`/api/commands/${id}`:'/api/commands',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});closeModal();await load()}
async function removeCommand(id,name){if(!isAdmin())return;if(!confirm(`ลบคำสั่ง “${name}” ?`))return;await api(`/api/commands/${id}?user_id=${encodeURIComponent(uid)}&household_id=${activeId}`,{method:'DELETE'});await load()}
async function backupDb(){if(!isAdmin())return;window.location.href='/api/backup/database'}
async function switchHouse(id){activeId=Number(id);await api('/api/households/switch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,household_id:activeId})});await load()}
function shift(n){const d=new Date(month+'-01');d.setMonth(d.getMonth()+n);month=d.toISOString().slice(0,7);loadData().then(render)}
function showAddHelp(){alert('กลับไปที่ LINE แล้วพิมพ์ เช่น “กินข้าว 60” หรือ “เงินเดือน 25000”')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openHouses(){document.getElementById('modalTitle').textContent='🏠 บ้านของฉัน';document.getElementById('modalBody').innerHTML=`<p style="color:#8c8088">เลือกบ้าน หรือจัดการบ้าน</p><div class="manage">${houses.map(h=>`<div class="row"><div><b>${h.name}${h.id===activeId?' ⭐':''}</b><small style="display:block;color:#8c8088">${h.role==='owner'?'ADMIN / เจ้าของ':h.role==='admin'?'ADMIN':'สมาชิก'} · ${h.invite_code}</small></div><div class="actions"><button class="btn" onclick="switchHouse(${h.id});closeModal()">ใช้บ้านนี้</button>${h.role==='owner'?`<button class="btn" onclick="renameHouse(${h.id},'${h.name.replace(/'/g,"\\'")}')">แก้ชื่อ</button><button class="btn" onclick="deleteHouse(${h.id},'${h.name.replace(/'/g,"\\'")}')">ลบ</button>`:''}</div></div>`).join('')}</div><div style="margin-top:12px"><button class="btn primary" onclick="createHouse()">＋ สร้างบ้านใหม่</button></div>`;document.getElementById('modal').classList.add('show')}
async function createHouse(){const n=prompt('ชื่อบ้านใหม่ เช่น ร้านขนม / บ้านแม่ / เที่ยวญี่ปุ่น');if(!n?.trim())return;await api('/api/households/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,name:n.trim()})});await load();openHouses()}
async function renameHouse(id,old){const n=prompt('เปลี่ยนชื่อบ้าน',old);if(!n||n.trim()===old)return;await api('/api/households/rename',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,household_id:id,name:n.trim()})});await load();openHouses()}
async function deleteHouse(id,name){if(!confirm(`ลบบ้าน “${name}” ?`))return;const n=prompt(`พิมพ์ชื่อบ้านเพื่อยืนยัน\n${name}`);if(n!==name)return alert('ยกเลิกการลบ');await api(`/api/households/${id}?user_id=${encodeURIComponent(uid)}`,{method:'DELETE'});closeModal();await load()}
if(uid)load();else setup();
</script>
</body></html>
