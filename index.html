<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeeTang — Dashboard</title>
<style>
:root{--bg:#fff8fb;--card:#fff;--ink:#29252a;--muted:#8a7f88;--pink:#ff9fbd;--pink2:#ffe3ec;--green:#91d7ad;--green2:#e5f7ec;--yellow:#ffd98e;--yellow2:#fff2ce;--purple:#c9b7ef;--purple2:#eee8fb;--blue:#a9d5f5;--blue2:#e6f3fd;--danger:#ef7189;--line:#f0e6eb}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff8fb 0,#f8fbff 100%);color:var(--ink);font-family:"Noto Sans Thai",Arial,sans-serif}.wrap{max-width:1120px;margin:auto;padding:24px 18px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:17px;background:var(--pink2);display:grid;place-items:center;font-size:27px}.brand h1{font-size:25px;margin:0}.muted{color:var(--muted)}.sub{margin:2px 0 0;color:var(--muted);font-size:13px}.picker{background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px #dcb8c925;border-radius:18px;padding:9px 12px;display:flex;align-items:center;gap:8px}.picker select{border:0;background:transparent;font:inherit;font-weight:700;outline:0;min-width:170px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:10px 14px;font:inherit;cursor:pointer;background:#fff;box-shadow:0 5px 15px #c9aeba22}.btn.primary{background:var(--pink);color:#fff}.btn.soft{background:var(--pink2)}.btn.danger{background:#ffe5ea;color:#b13d55}.month{display:flex;justify-content:space-between;align-items:center;margin:18px 0}.month strong{font-size:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 10px 28px #cdb8c51c}.metric .label{color:var(--muted);font-size:13px}.metric .num{font-size:28px;font-weight:800;margin-top:5px}.metric.income{background:var(--green2)}.metric.expense{background:#fff0f4}.metric.balance{background:var(--blue2)}.section{margin-top:16px}.section h2{font-size:18px;margin:0 0 14px}.twocol{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.cat{margin:11px 0}.catrow,.txrow{display:flex;justify-content:space-between;gap:12px;align-items:center}.catname{display:flex;gap:8px}.bar{height:8px;background:#f0edf0;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;border-radius:99px;background:var(--pink)}.txrow{padding:12px 0;border-bottom:1px solid var(--line)}.txrow:last-child{border-bottom:0}.txname{font-weight:700}.txdate{font-size:12px;color:var(--muted);margin-top:2px}.plus{color:#2d9a61}.minus{color:#d34c68}.house-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.house{padding:14px;border-radius:16px;border:1px solid var(--line);background:#fff;cursor:pointer;text-align:left}.house.active{outline:2px solid var(--pink);background:var(--pink2)}.house b{display:block}.house small{color:var(--muted)}.badge{display:inline-block;font-size:11px;padding:3px 7px;border-radius:99px;background:#fff;margin-left:5px}.empty{text-align:center;padding:30px;color:var(--muted)}.setup{max-width:620px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:0 12px 35px #cdb8c51f}.input{width:100%;padding:12px 13px;border:1px solid #e6dce1;border-radius:13px;font:inherit;outline:none}.help{font-size:13px;color:var(--muted);line-height:1.7}.modal{position:fixed;inset:0;background:#2d26304d;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;border-radius:24px;max-width:520px;width:100%;padding:22px;box-shadow:0 20px 60px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#f5eef2;border-radius:50%;width:34px;height:34px;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:820px){.grid,.twocol{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.picker{width:100%}.picker select{flex:1}.house-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">จัดการบ้าน</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const money=n=>new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:0}).format(Number(n||0));
const icons={'อาหาร':'🍜','บ้าน':'🏠','เดินทาง':'🚗','ช้อปปิ้ง':'🛍️','บิล/ค่าสาธารณูปโภค':'🧾','สุขภาพ':'💗','บันเทิง':'🎬','ท่องเที่ยว':'✈️','เงินออม/ลงทุน':'💰','เงินเดือน':'💵','ธุรกิจ':'🏪','อื่นๆ':'📦'};
let userId=localStorage.getItem('meetang_user_id')||'';let houses=[];let activeId=null;let summary=null;let recent=[];let month=new Date().toISOString().slice(0,7);
const app=document.getElementById('app');
function setup(){app.innerHTML=`<div class="setup"><div class="logo">🐰</div><h1>ยินดีต้อนรับสู่ MeeTang</h1><p class="muted">Dashboard สำหรับดูเงินแยกตามบ้าน/บัญชี</p><label>LINE User ID</label><input class="input" id="uid" placeholder="พิมพ์ “รหัสของฉัน” ใน LINE เพื่อดูรหัส"><p class="help">รหัสนี้ใช้เลือกบ้านของคุณใน Dashboard เท่านั้น ไม่ต้องส่ง Channel Secret หรือ Access Token</p><button class="btn primary" onclick="saveUser()">เข้า Dashboard →</button></div>`}
function saveUser(){const v=document.getElementById('uid').value.trim();if(!v)return alert('กรุณาใส่ LINE User ID');userId=v;localStorage.setItem('meetang_user_id',v);loadAll()}
async function api(url,opt){const r=await fetch(url,opt);if(!r.ok)throw new Error(await r.text());return r.json()}
async function loadAll(){try{const h=await api('/api/households?user_id='+encodeURIComponent(userId));houses=h.households||[];activeId=h.active_household_id;if(!houses.length){app.innerHTML=`<div class="setup"><div class="logo">🏠</div><h1>ยังไม่มีบ้าน</h1><p class="muted">สร้างบ้านจาก LINE ได้เลย เช่น <b>สร้างบ้าน บ้านของเรา</b></p><button class="btn primary" onclick="location.reload()">รีเฟรช</button></div>`;return}if(!activeId)activeId=houses[0].id;await loadData();render()}catch(e){app.innerHTML=`<div class="setup"><h2>เชื่อม Dashboard ไม่สำเร็จ</h2><p class="muted">${e.message}</p><button class="btn primary" onclick="location.reload()">ลองใหม่</button></div>`}}
async function loadData(){const [s,r]=await Promise.all([api(`/api/summary?month=${month}&user_id=${encodeURIComponent(userId)}&household_id=${activeId}`),api(`/api/recent?limit=12&user_id=${encodeURIComponent(userId)}&household_id=${activeId}`)]);summary=s;recent=r}
function houseName(){return houses.find(x=>x.id===activeId)?.name||'บ้านของฉัน'}
function render(){app.innerHTML=`<div class="wrap"><div class="top"><div class="brand"><div class="logo">🐰</div><div><h1>MeeTang</h1><p class="sub">มีตังค์ ไม่งงเรื่องเงิน</p></div></div><div class="picker"><span>🏠</span><select onchange="switchHouse(this.value)">${houses.map(h=>`<option value="${h.id}" ${h.id===activeId?'selected':''}>${h.name}${h.id===activeId?' ⭐':''}</option>`).join('')}</select><button class="btn soft" onclick="openHouses()">จัดการ</button></div></div><div class="toolbar"><button class="btn soft" onclick="openHouses()">🏠 บ้านของฉัน</button><button class="btn" onclick="changeUser()">👤 เปลี่ยนบัญชี</button></div><div class="month"><button class="btn" onclick="shiftMonth(-1)">‹</button><strong>📊 ${formatMonth(month)} · ${houseName()}</strong><button class="btn" onclick="shiftMonth(1)">›</button></div><div class="grid"><div class="card metric income"><div class="label">💰 รายรับ</div><div class="num">${money(summary.income)}</div></div><div class="card metric expense"><div class="label">💸 รายจ่าย</div><div class="num">${money(summary.expense)}</div></div><div class="card metric balance"><div class="label">💚 คงเหลือ</div><div class="num">${money(summary.balance)}</div></div></div><div class="twocol section"><div class="card"><h2>📊 รายจ่ายตามหมวด</h2>${renderCats()}</div><div class="card"><h2>📋 รายการล่าสุด</h2>${renderRecent()}</div></div><div class="card section"><h2>🏠 บ้านที่ฉันมี</h2><div class="house-grid">${houses.map(h=>`<button class="house ${h.id===activeId?'active':''}" onclick="switchHouse(${h.id})">🏠 <b>${h.name}${h.id===activeId?'<span class="badge">กำลังใช้</span>':''}</b><small>รหัสเชิญ ${h.invite_code}</small></button>`).join('')}</div></div></div>`}
function renderCats(){if(!summary.categories?.length)return '<div class="empty">เดือนนี้ยังไม่มีรายจ่าย</div>';const max=summary.categories[0].total||1;return summary.categories.map(c=>`<div class="cat"><div class="catrow"><span class="catname">${icons[c.category]||'📦'} ${c.category}</span><b>${money(c.total)}</b></div><div class="bar"><div class="fill" style="width:${Math.min(100,c.total/max*100)}%"></div></div></div>`).join('')}
function renderRecent(){if(!recent.length)return '<div class="empty">ยังไม่มีรายการ</div>';return recent.map(x=>`<div class="txrow"><div><div class="txname">${icons[x.category]||'📦'} ${x.category}</div><div class="txdate">${x.merchant||x.note||'รายการ'} · ${formatDate(x.occurred_at)}</div></div><b class="${x.type==='income'?'plus':'minus'}">${x.type==='income'?'+':'-'}${money(x.amount)}</b></div>`).join('')}
function formatMonth(v){const [y,m]=v.split('-');return `${['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][Number(m)-1]} ${Number(y)+543}`}
function formatDate(v){return new Date(v).toLocaleDateString('th-TH',{day:'numeric',month:'short'})}
function shiftMonth(n){let d=new Date(month+'-01');d.setMonth(d.getMonth()+n);month=d.toISOString().slice(0,7);loadData().then(render)}
async function switchHouse(id){activeId=Number(id);try{await api('/api/households/switch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,household_id:activeId})});await loadData();render()}catch(e){alert('สลับบ้านไม่สำเร็จ')}}
function changeUser(){localStorage.removeItem('meetang_user_id');userId='';setup()}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openHouses(){document.getElementById('modalTitle').textContent='🏠 บ้านของฉัน';document.getElementById('modalBody').innerHTML=`<p class="muted">เลือกบ้านที่ต้องการใช้งาน หรือจัดการบ้าน</p>${houses.map(h=>`<div class="txrow"><div><b>${h.name}</b><div class="txdate">${h.id===activeId?'⭐ กำลังใช้งาน · ':''}รหัส ${h.invite_code} · ${h.role==='owner'?'เจ้าของ':'สมาชิก'}</div></div><div class="actions"><button class="btn soft" onclick="switchHouse(${h.id});closeModal()">ใช้บ้านนี้</button><button class="btn" onclick="renameHouse(${h.id},'${escapeAttr(h.name)}')">แก้ชื่อ</button>${h.role==='owner'?`<button class="btn danger" onclick="deleteHouse(${h.id},'${escapeAttr(h.name)}')">ลบ</button>`:''}</div></div>`).join('')}<div class="actions"><button class="btn primary" onclick="createHouse()">＋ สร้างบ้านใหม่</button></div>`;document.getElementById('modal').classList.add('show')}
function escapeAttr(s){return s.replace(/'/g,"\\'")}
async function createHouse(){const name=prompt('ชื่อบ้านใหม่ เช่น ร้านขนม / บ้านแม่ / เที่ยวญี่ปุ่น');if(!name?.trim())return;try{await api('/api/households/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,name:name.trim()})});await loadAll();openHouses()}catch(e){alert('สร้างบ้านไม่สำเร็จ')}}
async function renameHouse(id,old){const name=prompt('เปลี่ยนชื่อบ้าน',old);if(!name||name.trim()===old)return;try{await api('/api/households/rename',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,household_id:id,name:name.trim()})});await loadAll();openHouses()}catch(e){alert('เปลี่ยนชื่อไม่สำเร็จ')}}
async function deleteHouse(id,name){if(!confirm(`ลบบ้าน “${name}” ?\n\nรายการเงินและข้อมูลการหารของบ้านนี้จะถูกลบทั้งหมด`))return;const typed=prompt(`พิมพ์ชื่อต่อไปนี้เพื่อยืนยัน:\n${name}`);if(typed!==name)return alert('ชื่อไม่ตรง ยกเลิกการลบแล้ว');try{await api(`/api/households/${id}?user_id=${encodeURIComponent(userId)}`,{method:'DELETE'});await loadAll();openHouses()}catch(e){alert('ลบบ้านไม่สำเร็จ')}}
if(userId)loadAll();else setup();
</script>
</body></html>
